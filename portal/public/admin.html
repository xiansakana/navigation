<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限管理 · 服务导航</title>
    <script>(function(){try{var t=localStorage.getItem("portal-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="/portal.css">
</head>
<body class="has-navbar admin-page">
    <header class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="/">
                <span class="navbar-logo">⚡</span>
                <span>服务导航</span>
            </a>
            <nav class="navbar-nav">
                <a class="navbar-link" href="/"><span class="label">首页</span></a>
                <span class="navbar-sep"></span>
                <span class="navbar-title">权限管理</span>
            </nav>
            <div class="navbar-actions">
                <button type="button" class="btn ghost navbar-theme-btn" aria-label="切换主题">
                    <span class="navbar-theme-icon" aria-hidden="true">☀️</span>
                    <span class="label navbar-theme-label">日间</span>
                </button>
                <span class="navbar-user" id="welcome">加载中…</span>
            </div>
        </div>
    </header>

    <div class="admin-shell">
        <aside class="admin-sidebar">
            <button type="button" class="admin-tab active" data-tab="users">用户</button>
            <button type="button" class="admin-tab" data-tab="roles">角色</button>
            <button type="button" class="admin-tab" data-tab="menus">菜单</button>
            <button type="button" class="admin-tab" data-tab="permissions">权限</button>
        </aside>

        <main class="admin-main">
            <section class="admin-panel active" id="panel-users">
                <div class="admin-panel-head">
                    <div>
                        <h1>用户管理</h1>
                        <p>创建账号并分配角色</p>
                    </div>
                    <button type="button" class="btn primary" id="btn-add-user">新建用户</button>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table" id="users-table">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>角色</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="admin-panel" id="panel-roles">
                <div class="admin-panel-head">
                    <div>
                        <h1>角色管理</h1>
                        <p>角色绑定一组权限</p>
                    </div>
                    <button type="button" class="btn primary" id="btn-add-role">新建角色</button>
                </div>
                <div class="admin-cards" id="roles-list"></div>
            </section>

            <section class="admin-panel" id="panel-menus">
                <div class="admin-panel-head">
                    <div>
                        <h1>菜单管理</h1>
                        <p>控制首页卡片显示、排序与启用状态</p>
                    </div>
                    <button type="button" class="btn primary" id="btn-save-menus">保存菜单</button>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table" id="menus-table">
                        <thead>
                            <tr>
                                <th>排序</th>
                                <th>图标</th>
                                <th>标题</th>
                                <th>权限</th>
                                <th>启用</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="admin-panel" id="panel-permissions">
                <div class="admin-panel-head">
                    <div>
                        <h1>权限清单</h1>
                        <p>系统权限与服务访问权限（只读，随 config.json 服务自动同步）</p>
                    </div>
                </div>
                <div class="admin-perm-groups" id="permissions-list"></div>
            </section>
        </main>
    </div>

    <dialog class="admin-dialog" id="user-dialog">
        <form method="dialog" class="admin-dialog-inner" id="user-form">
            <h2 id="user-dialog-title">新建用户</h2>
            <input type="hidden" id="user-id">
            <label>用户名<input type="text" id="user-username" required autocomplete="username"></label>
            <label id="user-password-wrap">密码<input type="password" id="user-password" autocomplete="new-password"></label>
            <fieldset class="admin-checks" id="user-roles"></fieldset>
            <label class="admin-switch"><input type="checkbox" id="user-enabled" checked> 启用账号</label>
            <div class="admin-dialog-actions">
                <button type="button" class="btn ghost" id="user-cancel">取消</button>
                <button type="submit" class="btn primary">保存</button>
            </div>
        </form>
    </dialog>

    <dialog class="admin-dialog" id="role-dialog">
        <form method="dialog" class="admin-dialog-inner" id="role-form">
            <h2 id="role-dialog-title">新建角色</h2>
            <input type="hidden" id="role-id">
            <label>角色名<input type="text" id="role-name" required></label>
            <label>描述<textarea id="role-desc" rows="2"></textarea></label>
            <fieldset class="admin-checks" id="role-permissions"></fieldset>
            <div class="admin-dialog-actions">
                <button type="button" class="btn ghost" id="role-cancel">取消</button>
                <button type="submit" class="btn primary">保存</button>
            </div>
        </form>
    </dialog>

    <script src="/theme.js"></script>
    <script src="/toast.js"></script>
    <script src="/dialog.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
