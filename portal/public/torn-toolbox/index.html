<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn 工具箱</title>
    <link rel="stylesheet" href="/portal.css">
</head>
<body class="has-navbar toolbox-page">
    <header class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="/">
                <span class="navbar-logo">⚡</span>
                <span>服务导航</span>
            </a>
            <nav class="navbar-nav">
                <a class="navbar-link active" href="/torn-toolbox/">
                    <span class="label">Torn 工具箱</span>
                </a>
            </nav>
        </div>
    </header>

    <section class="toolbox-hero">
        <div class="toolbox-hero-badge">🎮 Torn City 工具集</div>
        <h1>Torn 工具箱</h1>
        <p>压价助手与公司监听独立运行，互不影响，支持多账号与 QQ 通知</p>
    </section>

    <main class="toolbox-grid">
        <a class="toolbox-card" href="/torn-toolbox/undercut/">
            <div class="toolbox-card-icon undercut">📉</div>
            <h2>压价助手</h2>
            <p>Bazaar / Item Market 压价监听，支持多账号独立配置与指定物品筛选</p>
            <span class="toolbox-card-arrow">进入 →</span>
        </a>
        <a class="toolbox-card" href="/torn-toolbox/company/">
            <div class="toolbox-card-icon company">🏢</div>
            <h2>公司监听</h2>
            <p>公司申请实时提醒，支持多账号与多种 QQ 通知方式（群 @ / 私聊）</p>
            <span class="toolbox-card-arrow">进入 →</span>
        </a>
    </main>
</body>
</html>
