<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫货助手 · Torn 工具箱</title>
  <script defer src="/ui/back-to-top.js?v=1"></script>
  <link rel="stylesheet" href="/portal.css?v=layout-20261018">
  <link rel="stylesheet" href="/experience.css?v=mobile-sheets-1">
  <link rel="stylesheet" href="/torn-toolbox/chain/style.css?v=factions-2">
<style>#item-picker{position:relative;display:inline-block;max-width:100%}#item-dropdown{position:absolute;z-index:20;top:100%;left:0;width:min(400px,75vw);padding:12px;background:var(--bg-card,#18212e);border:1px solid var(--border,#64748b);border-radius:8px;box-sizing:border-box}#item-search{box-sizing:border-box;width:100%;padding:8px}#item-options{max-height:260px;overflow:auto}#item-options button{display:block;width:100%;padding:9px;text-align:left;background:transparent;color:inherit;border:0;overflow-wrap:anywhere;cursor:pointer}#item-options button[aria-selected="true"]{opacity:.6} .shopping-item-title{align-self:center;overflow-wrap:anywhere}</style></head>
<body class="portal-experience has-navbar portal-layout-enabled">
  <header class="navbar"><div class="navbar-inner">
    <a class="navbar-brand" href="/">⚡ 服务导航</a>
    <nav class="navbar-nav"><a class="navbar-link" href="/torn-toolbox/">Torn 工具箱</a></nav>
    <div class="navbar-actions"><button type="button" class="btn ghost navbar-layout-btn" aria-pressed="false">全宽</button></div>
  </div></header>
  <main class="chain-app" data-layout-container><h1>扫货助手</h1><p>市场使用 Torn API，巴扎沿用压价助手的 Weav3r 数据。仅提醒，不自动购买；轮询和数据缓存均可能带来延迟。价格小于或等于上限触发，同物品/来源/卖家/价格持久去重；降价产生新提醒。仅展示每次查询发现的最低5条符合挂单，不保证全市场覆盖。清空历史不重置去重。</p>
<section class="chain-panel"><form id="form"><div class="chain-fields"><label>API Keys（每行一个，留空保留）<textarea id="keys" autocomplete="off"></textarea></label><label>轮次间隔（秒）<input id="interval" type="number" min="1" max="3600" required></label><label>API请求间隔（秒/账号）<input id="apiInterval" type="number" min="1" max="60" step="0.1" required></label></div><p>市场与巴扎分别填写最高购买价，留空表示不监控该来源。</p><div id="items"></div><div id="item-picker"><button type="button" id="add" class="btn ghost" aria-expanded="false" aria-controls="item-dropdown">选择物品 ▾</button><div id="item-dropdown" hidden><label>搜索物品<input id="item-search" type="search" placeholder="输入物品名称或 ID" autocomplete="off"></label><div id="item-options" role="listbox" aria-label="物品目录" aria-multiselectable="true"></div></div></div><button class="btn" id="save">保存配置</button></form><div class="chain-actions"><button id="start" class="btn">启动</button><button id="stop" class="btn ghost">停止</button><button id="clear" class="btn ghost">清空历史</button></div></section>
<p>通知开关、QQ目标与测试请在<a href="/notifications/#shopping-notifications">通知管理 → 业务提醒 → 扫货助手</a>中统一配置。</p>
<p id="message" role="status"></p><section class="chain-panel"><h2>监控状态</h2><p id="status"></p><div id="results"></div></section><section class="chain-panel"><h2>低价记录</h2><div id="history"></div><div class="chain-actions" aria-label="通知记录分页"><label>每页 <select id="history-page-size"><option value="10">10 条</option><option value="20" selected>20 条</option><option value="50">50 条</option></select></label><button type="button" id="history-prev" class="btn ghost" disabled>上一页</button><span id="history-page-info" aria-live="polite"></span><button type="button" id="history-next" class="btn ghost" disabled>下一页</button></div></section></main>
<script src="/theme.js"></script><script src="/layout.js?v=layout-20261018"></script><script src="/torn-toolbox/shopping/app.js?v=4"></script></body></html>
