<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 服务导航</title>
    <script>(function(){try{var t=localStorage.getItem("portal-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="/portal.css">
</head>
<body class="login-page">
    <div class="login-theme-bar">
        <button type="button" class="btn ghost navbar-theme-btn" aria-label="切换主题">
            <span class="navbar-theme-icon" aria-hidden="true">☀️</span>
            <span class="label navbar-theme-label">日间</span>
        </button>
    </div>
    <div class="login-card">
        <h1>服务导航</h1>
        <p class="subtitle">登录后管理 ECS 上的各项服务</p>
        <form id="login-form">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" class="btn primary">登录</button>
            <p class="error" id="error" hidden></p>
        </form>
    </div>
    <script src="/theme.js"></script>
    <script src="/login.js"></script>
</body>
</html>
