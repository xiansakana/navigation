<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 服务导航</title>
    <script>(function(){document.documentElement.classList.add("portal-loading");document.documentElement.setAttribute("aria-busy","true");try{var t=localStorage.getItem("portal-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="/portal.css?v=layout-20261018">
    <link rel="stylesheet" href="/experience.css?v=mobile-sheets-1">
    <link rel="stylesheet" href="/skeleton/skeleton.css?v=2">
    <script src="/ui/input-guard.js?v=20261011-2"></script>
  <script defer src="/ui/back-to-top.js?v=1"></script>
</head>
<body class="portal-experience login-page">
    <div class="login-top-bar">
        <a href="/" class="btn ghost login-close-btn" id="login-close" aria-label="关闭并返回首页">关闭</a>
        <button type="button" class="btn ghost navbar-theme-btn" aria-label="切换主题">
            <span class="navbar-theme-icon" aria-hidden="true">☀️</span>
            <span class="label navbar-theme-label">日间</span>
        </button>
    </div>
    <main class="login-shell">
        <section class="login-brand" aria-hidden="true">
            <div class="login-brand-mark">⚡</div>
            <h2>Navigation</h2>
            <p>一个入口，抵达你的全部服务。</p>
            <div class="login-brand-lines">
                <span></span><span></span><span></span>
            </div>
            <ul class="login-brand-points">
                <li>统一身份与权限</li>
                <li>工具、笔记与投资记录</li>
                <li>随时随地，自托管</li>
            </ul>
        </section>
        <div class="login-card" data-skeleton="form" data-skeleton-key="page">
            <h1>欢迎回来</h1>
            <p class="subtitle">密码登录，或使用 GitHub / Google 注册（默认仍为游客权限，管理员可在后台分配角色）</p>
            <div id="login-view"></div>
            <noscript>请启用 JavaScript 后登录。</noscript>
        </div>
    </main>
    <script src="/skeleton/skeleton.js?v=1"></script>
    <script src="/theme.js"></script>
    <script src="/toast.js"></script>
    <script src="/dialog.js"></script>
    <script src="/login.js?v=vue-login-1"></script>
</body>
</html>
