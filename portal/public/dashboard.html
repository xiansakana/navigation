<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务导航</title>
    <script>(function(){document.documentElement.classList.add("portal-loading");document.documentElement.setAttribute("aria-busy","true");try{var t=localStorage.getItem("portal-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link rel="stylesheet" href="/portal.css?v=blog-rich-tags-1">
</head>
<body class="has-navbar portal-layout-enabled dashboard-page">
    <header class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="/">
                <span class="navbar-logo">⚡</span>
                <span>服务导航</span>
            </a>
            <div class="navbar-actions">
                <button type="button" class="btn ghost navbar-layout-btn" aria-pressed="false" aria-label="全宽布局"><span class="label">全宽</span></button>
                <a class="btn ghost hidden" id="admin-link" href="/admin.html">权限管理</a>
                <button type="button" class="btn ghost navbar-theme-btn" aria-label="切换主题">
                    <span class="navbar-theme-icon" aria-hidden="true">☀️</span>
                    <span class="label navbar-theme-label">日间</span>
                </button>
                <span class="navbar-user" id="welcome">欢迎</span>
                <button class="btn ghost" id="logout">退出登录</button>
            </div>
        </div>
    </header>
    <div class="page-header">
        <h1>我的服务</h1>
        <p>选择一项服务进入管理或访问</p>
        <a class="btn primary blog-shortcut hidden" id="blog-shortcut" href="#blog-section">写博客</a>
    </div>
    <main class="grid" id="service-grid"></main>
    <section class="blog-section hidden" id="blog-section" aria-label="博客动态">
        <div class="blog-heading">
            <div><span class="blog-eyebrow">BLOG / MOMENTS</span><h2>博客动态</h2><p>记录想法、进展与生活片段</p></div>
        </div>
        <form class="blog-composer hidden" id="blog-composer">
            <label for="blog-content">写点什么</label>
            <div id="blog-content"></div>
            <div id="blog-tags"></div>
            <div class="blog-image-preview" id="blog-preview"></div>
            <div class="blog-upload-row">
                <label class="btn ghost blog-upload-label" for="blog-images">📷 添加图片</label>
                <input id="blog-images" type="file" accept="image/*,.heic,.heif" multiple hidden>
                <label class="btn ghost blog-upload-label" for="blog-videos">🎬 添加视频</label>
                <input id="blog-videos" type="file" accept="video/mp4,video/webm,video/quicktime,.mov" multiple hidden>
                <span>图片统一转为 JPG 存入 B2；视频支持 MP4、WebM、MOV（50MB 内）。媒体链接可被持有链接的人访问。</span>
            </div>
            <div class="blog-composer-footer"><span id="blog-count">0 / 10000</span><button class="btn primary" type="submit" id="blog-submit">发布动态</button></div>
        </form>
        <div class="blog-tag-filter" id="blog-tag-filter" aria-label="按标签筛选"></div>
        <div class="blog-feed" id="blog-feed" aria-live="polite"></div>
        <div class="blog-loading hidden" id="blog-loading" role="status">
            <span class="blog-spinner" aria-hidden="true"></span><span>正在加载博客…</span>
        </div>
        <button type="button" class="btn ghost blog-more hidden" id="blog-more">加载更多</button>
    </section>
    <script src="/theme.js"></script>
    <script src="/layout.js?v=0615296"></script>
    <script src="/toast.js"></script>
    <script src="/dialog.js"></script>
    <script src="/dashboard.js"></script>
    <script src="/blog-editor.js?v=blog-rich-tags-1"></script>
    <script src="/blog.js?v=blog-rich-tags-1"></script>
</body>
</html>
