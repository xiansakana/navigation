services:
  piclist:
    image: piclist-server:local
    build: .
    container_name: piclist
    restart: unless-stopped
    ports:
      - "${PICLIST_PORT:-36677}:36677"
    volumes:
      - ./data:/root/.piclist
    environment:
      TZ: Asia/Shanghai
    command:
      - -k
      - ${PICLIST_SERVER_KEY:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:36677/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
