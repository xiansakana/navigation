name: Navigation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          for service in portal stock-manage qqq-dip qq-bot torn-toolbox-desktop; do
            npm ci --prefix "$service"
          done
      - run: npm run typecheck --prefix stock-manage && npm run build --prefix stock-manage
      - run: npm run typecheck --prefix portal && npm run build:views --prefix portal
      - run: npm test
      - run: npm run test:backup
      - run: python3 -m unittest discover -s portal/workers -p 'test_*.py'
      - run: git diff --check
  postgres-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: navigation_rehearsal_ci
          POSTGRES_USER: rehearsal
          POSTGRES_PASSWORD: rehearsal-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U rehearsal -d navigation_rehearsal_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: navigation_rehearsal_ci
      PGUSER: rehearsal
      PGPASSWORD: rehearsal-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'psycopg[binary]==3.3.9'
      - run: python -m unittest discover -s scripts -p test_rehearse_postgres.py -v
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
      - run: npm ci --prefix portal
      - run: npm ci --prefix qq-bot
      - run: npm ci --prefix qqq-dip
      - run: npm ci --prefix stock-manage
      - run: node --test scripts/test-mingli-postgres.mjs
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
      - run: |
          node scripts/test-qqq-dip-postgres.mjs
          node scripts/test-portfolio-postgres.mjs
        env:
          NAVIGATION_TEST_POSTGRES_URL: postgresql://rehearsal:rehearsal-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/navigation_rehearsal_ci
      - name: Verify PostgreSQL archive and restore
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          NAVIGATION_PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          clients="$RUNNER_TEMP/navigation-pg-clients"
          mkdir -p "$clients"
          for tool in pg_dump pg_restore psql; do
            printf '#!/usr/bin/env bash\nexec docker exec -i -e PGSERVICEFILE=/tmp/navigation-test-pg-service.conf "$NAVIGATION_PG_TEST_CONTAINER" %s "$@"\n' "$tool" > "$clients/$tool"
            chmod +x "$clients/$tool"
          done
          docker exec -i "$NAVIGATION_PG_TEST_CONTAINER" sh -c 'umask 077; cat > /tmp/navigation-test-pg-service.conf' <<'EOF'
          [backup-source]
          host=/var/run/postgresql
          dbname=navigation_rehearsal_ci
          user=rehearsal
          [backup-restore]
          host=/var/run/postgresql
          dbname=navigation_restore_backup_ci
          user=rehearsal
          EOF
          PATH="$clients:$PATH" python -m unittest discover -s scripts -p test_backup_postgres.py -v
