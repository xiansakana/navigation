<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票管理</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="sm-app" id="app">
    <header class="sm-header">
      <div class="sm-header-text">
        <h1>股票管理</h1>
        <p class="subtitle">美股持仓、交易记录与盈亏统计</p>
      </div>
      <div class="sm-header-actions">
        <button type="button" id="btn-trades" class="btn ghost">交易记录</button>
        <button type="button" id="btn-refresh" class="btn ghost">刷新价格</button>
        <button type="button" id="btn-import" class="btn ghost">导入交易</button>
        <button type="button" id="btn-add" class="btn primary">记一笔</button>
      </div>
    </header>

    <div class="sm-toggles">
      <label class="sm-toggle-row">
        <input type="checkbox" id="toggle-dashboard" checked>
        <span>显示看板（总资产、市值、盈亏、当日盈亏、现金）</span>
      </label>
      <label class="sm-toggle-row">
        <input type="checkbox" id="toggle-fullwidth">
        <span>全宽布局</span>
      </label>
    </div>

    <section class="sm-panel">
      <div class="sm-panel-head sm-panel-head--stack">
        <h2>查询盈亏</h2>
        <div class="sm-pnl-filter">
          <label class="sm-pnl-filter-field">
            <span class="sm-pnl-filter-label">起始</span>
            <input type="date" id="pnl-start">
          </label>
          <span class="sm-pnl-filter-sep">至</span>
          <label class="sm-pnl-filter-field">
            <span class="sm-pnl-filter-label">结束</span>
            <input type="date" id="pnl-end">
          </label>
          <div class="sm-pnl-filter-actions">
            <button type="button" id="btn-pnl-query" class="btn ghost sm-btn-sm">查询</button>
            <button type="button" id="btn-pnl-reset" class="btn ghost sm-btn-sm">重置</button>
          </div>
        </div>
      </div>
      <div id="pnl-stats" class="sm-stats sm-stats--inner"></div>
      <div id="pnl-chart"></div>
    </section>

    <section id="dashboard" class="sm-dashboard"></section>

    <section class="sm-panel">
      <div class="sm-panel-head">
        <h2>持仓明细</h2>
        <button type="button" id="btn-col-toggle" class="btn ghost sm-btn-sm">列数据</button>
      </div>
      <div id="col-toggle-panel" class="sm-col-panel hidden"></div>
      <div class="sm-table-wrap">
        <table class="sm-table" id="holdings-table">
          <thead id="holdings-head"></thead>
          <tbody id="holdings-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="modal-root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
