<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票管理</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="sm-app">
    <header class="sm-header">
      <div class="sm-header-text">
        <h1>股票管理</h1>
        <p class="subtitle">美股持仓、交易记录与盈亏统计</p>
      </div>
      <div class="sm-header-actions">
        <button type="button" id="btn-refresh" class="btn ghost">刷新行情</button>
        <button type="button" id="btn-import" class="btn ghost">导入交易</button>
        <button type="button" id="btn-add" class="btn primary">记一笔</button>
      </div>
    </header>

    <section class="sm-stats" id="summary-cards"></section>

    <section class="sm-panel">
      <div class="sm-panel-head">
        <h2>持仓</h2>
      </div>
      <div class="sm-table-wrap">
        <table class="sm-table">
          <thead>
            <tr>
              <th>代码</th><th>名称</th><th>数量</th><th>成本</th><th>现价</th><th>市值</th><th>盈亏</th><th>占比</th>
            </tr>
          </thead>
          <tbody id="holdings-body"></tbody>
        </table>
      </div>
    </section>

    <section class="sm-panel">
      <div class="sm-panel-head">
        <h2>盈亏统计</h2>
        <div class="sm-inline-form">
          <input type="date" id="pnl-start">
          <span class="sm-muted">至</span>
          <input type="date" id="pnl-end">
          <button type="button" id="btn-pnl" class="btn ghost">查询</button>
        </div>
      </div>
      <div id="pnl-box" class="sm-stats sm-stats--inner"></div>
    </section>

    <section class="sm-panel">
      <div class="sm-panel-head">
        <h2>交易记录</h2>
      </div>
      <div class="sm-table-wrap">
        <table class="sm-table">
          <thead>
            <tr>
              <th>时间</th><th>类型</th><th>代码</th><th>名称</th><th>数量</th><th>价格</th><th>金额</th><th>费用</th><th></th>
            </tr>
          </thead>
          <tbody id="trades-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="modal-root"></div>
  <script src="./app.js" type="module"></script>
</body>
</html>
