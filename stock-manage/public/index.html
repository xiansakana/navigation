<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票管理</title>
  <link rel="stylesheet" href="./style.css?v=holding-note">
  <link rel="stylesheet" href="/skeleton/skeleton.css?v=2">
  <script src="/ui/input-guard.js?v=20261011-2"></script>
  <script defer src="/ui/back-to-top.js?v=1"></script>
</head>
<body>
  <div class="sm-app" id="app" data-layout-container data-skeleton="dashboard" data-skeleton-key="page">
    <nav class="sm-feature-tabs" aria-label="股票功能">
      <a class="sm-feature-tab active" href="/stock-manage/">持仓</a>
      <a class="sm-feature-tab" href="/stock-manage/dip/">抄底监控</a>
      <a class="sm-feature-tab" href="/stock-manage/quant/">量化分析</a>
    </nav>

    <section class="sm-panel" id="section-pnl">
      <div class="sm-panel-head sm-panel-head--pnl">
        <h2>查询盈亏</h2>
      </div>
      <div class="sm-pnl-period">
        <div class="sm-seg" role="group" aria-label="盈亏时间范围">
          <button type="button" class="sm-seg-btn" data-pnl-period="week">周</button>
          <button type="button" class="sm-seg-btn" data-pnl-period="month">月</button>
          <button type="button" class="sm-seg-btn" data-pnl-period="year">年</button>
          <button type="button" class="sm-seg-btn active" data-pnl-period="all" aria-pressed="true">全部</button>
          <button type="button" class="sm-seg-btn" data-pnl-period="range">范围</button>
        </div>
        <div class="sm-pnl-period-controls hidden" id="pnl-navigation">
          <div class="sm-pnl-date-stepper">
            <button type="button" id="pnl-prev" class="sm-pnl-control" aria-label="上一时间段">‹</button>
            <span id="pnl-caption" aria-live="polite"></span>
            <button type="button" id="pnl-next" class="sm-pnl-control" aria-label="下一时间段">›</button>
          </div>
          <div class="sm-pnl-date-jump">
            <input type="date" id="pnl-anchor" aria-label="定位日期" title="定位日期">
            <button type="button" id="pnl-today" class="sm-pnl-control">今天</button>
          </div>
        </div>
        <div class="sm-pnl-period-controls sm-pnl-date-range hidden" id="pnl-range">
          <input type="date" id="pnl-start" aria-label="开始日期" title="开始日期">
          <span aria-hidden="true">至</span>
          <input type="date" id="pnl-end" aria-label="结束日期" title="结束日期">
          <button type="button" id="btn-pnl-query" class="sm-pnl-control sm-pnl-apply">查询</button>
        </div>
      </div>
      <div id="pnl-stats" class="sm-stats sm-stats--inner"></div>
      <div id="pnl-chart"></div>
    </section>

    <div class="sm-dashboard-block" id="section-dashboard">
      <div class="sm-toggles">
        <label class="sm-toggle-row sm-dashboard-toggle">
          <input type="checkbox" id="toggle-dashboard" checked>
          <span>显示看板（总资产、市值、盈亏、当日盈亏、现金）</span>
        </label>
        <label class="sm-toggle-row sm-pnl-visible-toggle">
          <input type="checkbox" id="toggle-pnl-visible" checked>
          <span>显示盈亏数据</span>
        </label>
      </div>
      <section id="dashboard" class="sm-dashboard"></section>
    </div>

    <section class="sm-panel">
      <div class="sm-panel-head">
        <h2>持仓明细</h2>
        <div class="sm-panel-head-actions">
          <select id="account-filter" aria-label="证券账户" hidden><option value="">全部账户</option></select>
          <button type="button" id="btn-accounts" class="btn ghost sm-btn-sm" hidden>账户管理</button>
          <button type="button" id="btn-trades" class="btn ghost sm-btn-sm" hidden>交易记录</button>
          <button type="button" id="btn-import" class="btn ghost sm-btn-sm" hidden>导入交易</button>
          <button type="button" id="btn-add" class="btn primary sm-btn-sm">记一笔</button>
          <button type="button" id="btn-refresh" class="btn ghost sm-btn-sm">刷新价格</button>
          <button type="button" id="btn-col-toggle" class="btn ghost sm-btn-sm">列数据</button>
        </div>
      </div>
      <div id="col-toggle-panel" class="sm-col-panel hidden"></div>
      <div id="quote-refresh-status" class="sm-quote-refresh sm-holdings-hint hint" hidden>
        <progress aria-label="报价刷新进度" hidden></progress>
        <span role="status" aria-live="polite"></span>
      </div>
      <p class="sm-holdings-hint hint">同标的自动分组（期权归入正股）。拖动代码旁的 ⠿ 到另一行代码可合并，点击 ↺ 恢复。点击「代码」或「仓位 / 占比」表头可排序。</p>
      <div class="sm-table-wrap">
        <table class="sm-table" id="holdings-table">
          <thead id="holdings-head"></thead>
          <tbody id="holdings-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="modal-root"></div>
  <script src="/skeleton/skeleton.js?v=1"></script>
  <script type="module" src="./app-vue.js?v=vue-page-7"></script>
</body>
</html>
