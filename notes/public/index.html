<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>笔记</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="notes-app">
    <aside class="notes-sidebar">
      <div class="notes-sidebar-brand">
        <span class="notes-sidebar-logo">📝</span>
        <div class="notes-sidebar-brand-text">
          <span class="notes-sidebar-brand-title">笔记</span>
          <span id="sidebar-stats" class="notes-sidebar-stats"></span>
        </div>
      </div>

      <div class="notes-sidebar-section">
        <label class="notes-field-label" for="notebook-select">工作区</label>
        <div class="notes-notebook-row">
          <select id="notebook-select" class="notes-select"></select>
          <button type="button" id="btn-notebook-add" class="btn ghost notes-icon-btn" title="新建笔记本">+</button>
        </div>
        <div class="notes-notebook-actions">
          <button type="button" id="btn-notebook-rename" class="btn ghost notes-btn-sm">重命名</button>
          <button type="button" id="btn-notebook-delete" class="btn ghost notes-btn-sm danger">删除</button>
        </div>
      </div>

      <div class="notes-sidebar-section notes-sidebar-section--tight">
        <div class="notes-search-wrap">
          <span class="notes-search-icon" aria-hidden="true">⌕</span>
          <input type="search" id="note-search" class="notes-search" placeholder="搜索笔记…">
        </div>
        <div class="notes-filter-row">
          <select id="tag-filter" class="notes-select">
            <option value="">全部标签</option>
          </select>
          <button type="button" id="btn-note-add" class="btn primary notes-btn-sm">新建</button>
          <button type="button" id="btn-import-md" class="btn ghost notes-btn-sm" title="导入 Markdown">导入</button>
          <input type="file" id="import-file" accept=".md,.markdown,.txt" hidden>
        </div>
      </div>

      <div class="notes-tree-toolbar">
        <span class="notes-tree-label">页面</span>
        <select id="tree-sort" class="notes-select notes-select-sm" title="排序">
          <option value="updated">最近更新</option>
          <option value="title">按标题</option>
        </select>
        <button type="button" id="btn-tree-expand" class="btn ghost notes-icon-btn" title="全部展开">⤢</button>
        <button type="button" id="btn-tree-collapse" class="btn ghost notes-icon-btn" title="全部折叠">⤡</button>
      </div>

      <ul id="note-list" class="notes-list notes-tree-root"></ul>
    </aside>

    <main class="notes-main">
      <div id="notes-empty" class="notes-empty">
        <div class="notes-empty-card">
          <div class="notes-empty-icon">✦</div>
          <h2>开始写作</h2>
          <p>从左侧选择页面，或新建一篇笔记。支持子页面、标签、块引用与 Markdown。</p>
          <button type="button" class="btn primary" id="btn-empty-new">新建笔记</button>
        </div>
      </div>

      <div id="notes-editor-wrap" class="notes-editor-wrap hidden">
        <div class="notes-page-cover" aria-hidden="true"></div>
        <div class="notes-page">
          <div class="notes-page-inner">
            <nav id="note-breadcrumb" class="notes-breadcrumb hidden"></nav>

            <div class="notes-page-header">
              <input type="text" id="note-title" class="notes-title" placeholder="无标题" maxlength="200">
              <div class="notes-properties">
                <label class="notes-property" for="note-tags">
                  <span class="notes-property-label">标签</span>
                  <input type="text" id="note-tags" class="notes-tags" placeholder="添加标签，逗号分隔">
                </label>
                <div id="save-status" class="notes-save-status">就绪</div>
              </div>
            </div>

            <div class="notes-toolbar-wrap">
              <div class="notes-toolbar" id="notes-toolbar">
                <div class="notes-toolbar-group">
                  <button type="button" data-cmd="bold" class="btn ghost notes-tool" title="粗体"><b>B</b></button>
                  <button type="button" data-cmd="italic" class="btn ghost notes-tool" title="斜体"><i>I</i></button>
                  <button type="button" data-cmd="strike" class="btn ghost notes-tool" title="删除线"><s>S</s></button>
                  <button type="button" data-cmd="code" class="btn ghost notes-tool" title="行内代码">&lt;/&gt;</button>
                </div>
                <span class="notes-tool-sep"></span>
                <div class="notes-toolbar-group">
                  <button type="button" data-cmd="h1" class="btn ghost notes-tool" title="标题 1">H1</button>
                  <button type="button" data-cmd="h2" class="btn ghost notes-tool" title="标题 2">H2</button>
                  <button type="button" data-cmd="h3" class="btn ghost notes-tool" title="标题 3">H3</button>
                </div>
                <span class="notes-tool-sep"></span>
                <div class="notes-toolbar-group">
                  <button type="button" data-cmd="bulletList" class="btn ghost notes-tool" title="无序列表">•</button>
                  <button type="button" data-cmd="orderedList" class="btn ghost notes-tool" title="有序列表">1.</button>
                  <button type="button" data-cmd="blockquote" class="btn ghost notes-tool" title="引用">❝</button>
                  <button type="button" data-cmd="codeBlock" class="btn ghost notes-tool" title="代码块">{ }</button>
                  <button type="button" data-cmd="hr" class="btn ghost notes-tool" title="分隔线">—</button>
                  <button type="button" id="btn-insert-ref" class="btn ghost notes-tool" title="块引用">🔗</button>
                </div>
                <span class="notes-tool-sep"></span>
                <div class="notes-toolbar-group">
                  <button type="button" data-cmd="undo" class="btn ghost notes-tool" title="撤销">↶</button>
                  <button type="button" data-cmd="redo" class="btn ghost notes-tool" title="重做">↷</button>
                </div>
                <span class="notes-toolbar-spacer"></span>
                <div class="notes-toolbar-group notes-toolbar-actions">
                  <button type="button" id="btn-subpage" class="btn ghost notes-btn-sm">子页面</button>
                  <button type="button" id="btn-export-md" class="btn ghost notes-btn-sm">导出</button>
                  <button type="button" id="btn-note-duplicate" class="btn ghost notes-btn-sm">复制</button>
                  <button type="button" id="btn-note-delete" class="btn ghost notes-btn-sm danger">删除</button>
                </div>
              </div>
            </div>

            <div class="notes-editor-body">
              <div id="note-editor" class="notes-editor"></div>
              <aside id="backlinks-panel" class="notes-backlinks hidden">
                <h3>反向链接</h3>
                <ul id="backlinks-list"></ul>
              </aside>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
